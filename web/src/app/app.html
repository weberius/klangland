<a class="skip-link" href="#main">Zum Inhalt springen</a>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" routerLink="/" aria-label="Klangland Startseite">
      <span class="brand-mark" aria-hidden="true">♪</span>
      <span class="brand-text">Klangland</span>
    </a>
    <button
      #burgerButton
      type="button"
      class="nav-toggle"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="main-nav"
      [attr.aria-label]="menuOpen() ? 'Menü schließen' : 'Menü öffnen'"
    >
      <span class="nav-toggle-icon" aria-hidden="true"></span>
    </button>
    <nav
      id="main-nav"
      class="main-nav"
      [class.open]="menuOpen()"
      aria-label="Hauptnavigation"
    >
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Kalender</a>
      <a routerLink="/ensembles" routerLinkActive="active" (click)="closeMenu()">Ensembles</a>
      <a routerLink="/venues" routerLinkActive="active" (click)="closeMenu()">Spielstätten</a>
    </nav>
  </div>
</header>

<main id="main" class="container" tabindex="-1">
  @if (data.hasError()) {
    <div class="notice notice-error" role="alert">
      <p><strong>Die Veranstaltungsdaten konnten nicht geladen werden.</strong></p>
      <p>Bitte versuche es später erneut.</p>
    </div>
  } @else {
    <router-outlet />
  }
</main>

<footer class="site-footer">
  <div class="container">
    <p>Klangland – Konzertkalender für Nordrhein-Westfalen. Statische App, Daten aus versionierten JSON-Dateien.</p>
  </div>
</footer>
